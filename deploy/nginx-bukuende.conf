# /etc/nginx/sites-available/bukuende
# Pasang sebelum certbot; certbot akan menambahkan bagian HTTPS (listen 443)
# dan pengalihan http -> https ke file ini.
server {
    listen 80;
    listen [::]:80;
    server_name bukuende.com www.bukuende.com;
    root /var/www/bukuende;
    index index.html;

    # www -> tanpa www (satu alamat untuk Google)
    if ($host = www.bukuende.com) { return 301 https://bukuende.com$request_uri; }

    location / { try_files $uri $uri/ =404; }
    error_page 404 /404.html;

    location /assets/ { expires 7d; }
    location /data/   { expires 1d; }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}

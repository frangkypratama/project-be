# /etc/nginx/sites-available/bukuende
# Pasang sebelum certbot; certbot akan menambahkan bagian HTTPS (listen 443)
# dan pengalihan http -> https ke file ini.

# www -> tanpa www (satu alamat untuk Google).
# Blok terpisah (bukan "if" di blok utama) supaya pemeriksaan certbot
# untuk www.bukuende.com/.well-known/acme-challenge/ tidak ikut dialihkan.
server {
    listen 80;
    listen [::]:80;
    server_name www.bukuende.com;
    location /.well-known/acme-challenge/ { root /var/www/bukuende; }
    location / { return 301 https://bukuende.com$request_uri; }
}

server {
    listen 80;
    listen [::]:80;
    server_name bukuende.com;
    root /var/www/bukuende;
    index index.html;

    location / { try_files $uri $uri/ =404; }
    error_page 404 /404.html;

    location /assets/ { expires 7d; }
    location /data/   { expires 1d; }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}

name: hkbp
description: Buku Ende dan Buku Nyanyian HKBP Digital (luring) — versi Flutter.
publish_to: none
version: 3.1.0+6

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.0
  just_audio: ^0.10.0
  webview_flutter: ^4.10.0
  wakelock_plus: ^1.2.0
  share_plus: ">=10.0.0 <14.0.0"
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  crypto: ^3.0.3
  flutter_lints: ">=5.0.0 <7.0.0"

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/web/

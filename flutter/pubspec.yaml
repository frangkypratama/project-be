name: hkbp
description: Buku Ende dan Buku Nyanyian HKBP Digital (luring) — versi Flutter.
publish_to: none
version: 3.0.0+5

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: any
  just_audio: any
  path_provider: any
  webview_flutter: any
  wakelock_plus: any
  share_plus: any
  url_launcher: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  crypto: any
  flutter_lints: any

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/web/

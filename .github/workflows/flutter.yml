name: Bangun APK Flutter

on:
  workflow_dispatch:
  push:
    paths:
      - "flutter/**"
      - "android/score.html"
      - "android/prepare_assets.py"
      - ".github/workflows/flutter.yml"

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Siapkan aset lagu
        run: sh flutter/prepare_assets.sh

      - name: Lengkapi kerangka Android (berkas yang belum ada saja)
        working-directory: flutter
        run: |
          flutter --version
          flutter create --platforms=android --org com.bukuende --project-name hkbp --no-pub . 
          rm -f test/widget_test.dart
          ls android android/app/src/main/kotlin/com/bukuende/hkbp

      - name: Pub get
        working-directory: flutter
        run: flutter pub get

      - name: Analisis
        working-directory: flutter
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee ../analyze.log

      - name: Uji
        working-directory: flutter
        run: |
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee ../test.log

      - name: Bangun APK dan AAB
        working-directory: flutter
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee ../build.log
          flutter build appbundle --release 2>&1 | tee -a ../build.log
          ls -l build/app/outputs/flutter-apk/ build/app/outputs/bundle/release/

      - name: Laporkan galat
        if: failure()
        run: |
          touch analyze.log test.log build.log
          { grep -E "^\s*error •|^error -" analyze.log | head -40;
            grep -E "Expected|Actual|BEDA|FAILED|\[E\]|Error:|error:" test.log | head -30;
            grep -E "^e: |Error:|error:|What went wrong" -A3 build.log | head -40; } > err.txt || true
          echo "::error::$(sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' err.txt)"

      - uses: actions/upload-artifact@v4
        with:
          name: buku-ende-flutter-apk
          path: flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: buku-ende-flutter-aab
          path: flutter/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

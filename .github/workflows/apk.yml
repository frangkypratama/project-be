name: Bangun APK Buku Ende

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/apk.yml"

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Siapkan isi situs sebagai aset
        run: python3 android/prepare_assets.py

      - name: Siapkan kunci penanda tangan
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ks.jks"
            echo "KS_PASS=$KEYSTORE_PASS" >> "$GITHUB_ENV"
            echo "KS_ALIAS=$KEYSTORE_ALIAS" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -keystore "$RUNNER_TEMP/ks.jks" -storepass bukuende -keypass bukuende \
              -alias bukuende -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Buku Ende HKBP Digital"
            echo "KS_PASS=bukuende" >> "$GITHUB_ENV"
            echo "KS_ALIAS=bukuende" >> "$GITHUB_ENV"
          fi
          echo "KS_FILE=$RUNNER_TEMP/ks.jks" >> "$GITHUB_ENV"

      - name: Bangun APK
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      - name: Ringkasan APK
        run: |
          ls -l android/app/build/outputs/apk/release/
          "$ANDROID_HOME"/build-tools/*/aapt2 dump badging android/app/build/outputs/apk/release/app-release.apk | head -8 || true

      - uses: actions/upload-artifact@v4
        with:
          name: buku-ende-hkbp-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
